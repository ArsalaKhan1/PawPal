<!DOCTYPE html>
<html lang = "en">
    <head> 
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
        <link rel = "stylesheet" href = "css/style.css">
        <script src = "js/script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>PawPal</h1>
            <nav>
                <a href = "index.html">Home</a> 
                <a href = "login.html">Login</a> 
                <a href = "register.html">Register</a> 
                <a href = "about.html">About</a>
            </nav>
        </header>
        <main>
            <p>Welcome to PawPal! Please fill out the form below to create an account.</p>
            <p>Already have an account? <a href = "login.html">Login instead</a></p>
            <h2>Create Account</h2>
            <form action = "/register" method = "POST">
                <label for = "fullname">Full Name</label>
                <br>
                <input type = "text" id = "fullname" name = "fullname" required>
                <br><br>
                <label for = "email">Email</label>
                <br>
                <input type = "email" id = "email" name = "email" required>
                <br><br>
                <label for = "password">Password</label>
                <br>
                <input type = "password" id = "password" name = "password" required>
                <br><br>
                <label for = "confirm_password">Confirm Password</label>
                <br>
                <input type = "password" id = "confirm_password" name = "ConfirmPassword" required>
                <br><br>

                <button type = "submit">Create Account</button>
            </form>
        </main>
        <footer>
            <p>2026 PawPal. All rights reserved.</p>
        </footer>
    </body>
</html>
