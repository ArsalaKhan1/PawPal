<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>About PawPal</title>
        <link rel = "stylesheet" href = "css/style.css">
        <script src = "js/script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>PawPal</h1>
            <nav>
                <a href ="index.html">Home</a> 
                <a href ="login.html">Login</a> 
                <a href ="register.html">Register</a> 
                <a href ="about.html">About</a>
            </nav>
        </header>
        <main>  
            <h2>Register a Pet</h2>
            <form id="petForm">
                <label>Name</label>
                <input type="text" id="petName" required>
                <br><br>
                
                <label>Animal</label>
                <input type="text" id="petAnimal" required>
                <br><br>

                <label>Breed</label>
                <input type="text" id="petBreed" required>
                <br><br>

                <label>Age</label>
                <input type="number" id="petAge" required>
                <br><br>
 
                <label>Weight</label>
                <input type="number" id="petWeight" required>
                <br><br>

                <button type="submit">Add Pet</button>
            </form>
            <hr>
            <div id="petContainer"></div>
        </main>
        <footer>
            <p>2026 PawPal. All rights reserved.</p>
        </footer>
    </body>
</html>
